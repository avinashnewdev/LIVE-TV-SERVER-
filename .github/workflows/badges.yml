name: Auto Gold Pull Shark (Zero Conflict)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  batch-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_PAT }}
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config --global user.name "avinashnewdev"
          git config --global user.email "234875233+avinashnewdev@users.noreply.github.com"

      - name: Create and Merge 25 PRs Safely
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          DEFAULT_BRANCH=$(git symbolic-ref refs/remotes/origin/HEAD | sed 's@^refs/remotes/origin/@@')
          git checkout "$DEFAULT_BRANCH"
          git pull origin "$DEFAULT_BRANCH"
          mkdir -p logs

          for ((i=1; i<=25; i++)); do
            UNIQUE_ID="$RANDOM-$i"
            BRANCH_NAME="badge-$UNIQUE_ID"
            
            git checkout -b "$BRANCH_NAME"
            echo "Unlocked PR $i at $(date)" > "logs/run-$UNIQUE_ID.txt"
            git add "logs/run-$UNIQUE_ID.txt"
            git commit -m "Badge PR #$i"
            git push -u origin "$BRANCH_NAME"

            PR_URL=$(gh pr create --title "Auto PR #$i" --body "Auto merge" --base "$DEFAULT_BRANCH" --head "$BRANCH_NAME")
            sleep 3
            gh pr merge "$PR_URL" --squash --delete-branch || true

            git checkout "$DEFAULT_BRANCH"
            git pull origin "$DEFAULT_BRANCH"
            sleep 2
          done
