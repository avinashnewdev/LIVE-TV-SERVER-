name: Auto Gold Pull Shark (Batch Mode)

on:
  workflow_dispatch:
  schedule:
    # Har 30 minute mein automatically chalega
    - cron: '*/30 * * * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  batch-prs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git User
        run: |
          git config --global user.name "avinashnewdev"
          git config --global user.email "APNI_EMAIL@gmail.com"

      - name: Create and Merge 45 PRs Safely
        env:
          GH_TOKEN: ${{ secrets.MY_PAT }}
        run: |
          DEFAULT_BRANCH=$(git remote show origin | grep 'HEAD branch' | cut -d' ' -f5)
          
          for ((i=1; i<=45; i++)); do
            BRANCH_NAME="gold-badge-$RANDOM-$i"
            git checkout -b "$BRANCH_NAME"
            echo "PR $i at $(date)" >> log.txt
            git add log.txt
            git commit -m "Auto PR #$i"
            git push -u origin "$BRANCH_NAME"

            PR_URL=$(gh pr create --title "Auto PR #$i" --body "Auto merge" --base "$DEFAULT_BRANCH" --head "$BRANCH_NAME")
            gh pr merge "$PR_URL" --merge --delete-branch

            git checkout "$DEFAULT_BRANCH"
            git pull origin "$DEFAULT_BRANCH"
            
            sleep 2
          done
